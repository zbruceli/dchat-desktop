appId: com.dchat.desktop
productName: D-Chat Desktop
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
asarUnpack:
  - "node_modules/@ffmpeg-installer/**"
mac:
  category: public.app-category.social-networking
  extendInfo:
    NSMicrophoneUsageDescription: "D-Chat needs microphone access to record voice messages."
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
linux:
  category: Network
  target:
    - AppImage
    - deb
